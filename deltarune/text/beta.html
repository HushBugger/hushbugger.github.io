<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Deltarune text dump | Beta</title>
        <link
            rel="shortcut icon"
            type="image/png"
            href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgBAMAAACB
            VGfHAAAAD1BMVEUAAADAgiYAAACFSh3AgibGPmPhAAAAAnRSTlMAAHaTzTgAAACXSURB
            VCiRhZHLDYRADEN9oISt4I0rQBQAGfdf0x6AhVntxzc/OXGkSH/1yKBNDwZtqhH4E5gv
            27CK5Eg5OUAfQXN2kJr3pUnRZpwcLUt6S+Yl/axt5aTcb3f4rPoKSH6c/g90gAIwwKIJ
            ICQEYNUEOLhIAatU4JTLKbC0z+B9+Srp3mPpFbkCUk6f81l58we5eSnJ4H/pCVYTQjf3
            DYm9AAAAAElFTkSuQmCC"
        />
        <link rel="preload" as="font" href="/style/8bitoperator-UTM.woff" crossorigin="anonymous" />
        <link rel="prefetch" href="search-worker.js" />
        <style>
            @font-face {
                font-family: "8bitoperator Undertale Mono";
                src: url("/style/8bitoperator-UTM.woff") format("woff");
            }

            @font-face {
                font-family: "JF Dot Shinonome 14 Regular";
                src: url("/style/JF-Dot-Shinonome-14-Regular.woff") format("woff");
            }

            html {
                --background-color: black;
                --foreground-color: white;

                background: black;
                color: white;
                background: var(--background-color);
                color: var(--foreground-color);
                font-family: sans-serif;

                /* Already the default for most browsers.
                 * Force it to ensure correct heights. */
                font-size: 16px;
                /* In-game line height (16px + 2px) */
                line-height: 18px;

                scroll-padding-top: 112px;
            }

            html.hidesearch {
                scroll-padding-top: 48px;
            }

            html.light {
                --background-color: white;
                --foreground-color: #2c1708;
            }

            /* Subpixel antialiasing looks bad with our font. mix-blend-mode prevents it.
             * On some browsers this causes blurry text so enable it selectively. */
            html.crisptext body {
                mix-blend-mode: difference;
            }
            html.crisptext.light body {
                mix-blend-mode: multiply;
            }

            body {
                margin: 0px;
            }

            #logo {
                padding: 10px;
                padding-bottom: 11px;
                display: block;
            }

            html.light #logo {
                filter: grayscale(1) invert(1);
            }

            html.expert #logo {
                width: 350px;
                height: 95px;
            }

            #intro {
                background: var(--foreground-color);
                color: var(--background-color);
                padding: 0.4em;
            }

            html.light #intro a {
                color: var(--background-color);
            }

            #controls {
                position: fixed;
                z-index: 1;
                top: 8px;
                left: 8px;
                width: calc(100% - 16px);
                max-height: calc(100vh - 16px);
                max-height: calc(100svh - 16px);
                max-height: calc(100dvh - 16px);
                display: flex;
                flex-direction: column;
            }

            #controls .row {
                display: flex;
                flex-direction: row;
                align-items: center;
                height: 36px;
                flex-wrap: wrap;
                z-index: 2;
            }

            select {
                height: 100%;
                flex: 1 1 auto;
                width: 0;
            }

            button {
                height: 100%;
                width: 44px;
            }

            #light-mode-toggle {
                width: 66px;
                height: 36px;
                background-image: url("spr_introimage1_0.png");
                background-size: cover;
                border-width: 0px;
                border-radius: 3px;
            }

            html.light #light-mode-toggle {
                background-image: url("spr_introimage1_1.png");
            }

            #controls #search1 {
                height: 44px;
            }

            input[type="search"] {
                height: 100%;
                flex: 1 1 auto;
                width: 0;
                z-index: 3;
            }

            input.error {
                outline: 2px solid red;
            }

            #controls #search2 {
                background-color: white;
                color: black;
                margin-top: -1px;
                font-size: 14px;
                height: 19px;
                display: none;
                flex-direction: row;
                border: 1px solid black;
                border-radius: 2px;
            }

            html.expert #controls #search2 {
                display: flex;
            }

            #controls #search2 div {
                flex-basis: 0;
                flex-grow: 1;
                max-width: 120px;
                display: flex;
                border-left: 1px solid black;
                margin-left: -1px;
                text-wrap: nowrap;
                overflow: hidden;
            }

            input[type="checkbox"] {
                height: 13px;
                width: 13px;
                margin: 3px;
            }

            #controls #search2 label {
                flex-grow: 1;
                user-select: none;
            }

            #searchresults {
                flex-grow: 1;
                overflow-y: auto;
                overflow-x: hidden;
                overflow-x: clip;
                /* Copies are monochrome. */
                background-color: #333;
                color: var(--foreground-color);
            }

            html.light #searchresults {
                background-color: #ddd;
            }

            .hideresults #searchresults,
            .hidesearch #controls search,
            html.hidesearch #searchresults {
                display: none;
            }

            #search-counter {
                font-size: 12px;
                background-color: white;
                color: black;
                height: calc(100% - 2px);
                padding-left: 6px;
                padding-right: 6px;
                border-radius: 1px;
                border: #999 solid 1px;
                display: flex;
                align-items: center;
            }

            #search-counter:empty {
                display: none;
            }

            section {
                --height-var: --narrow-height;
                --empty-height: var(--narrow-height);
            }

            section:empty {
                height: calc(var(--empty-height) * 1px);
            }

            #searchresults .result {
                cursor: pointer;
            }

            #searchresults .result:hover {
                background-color: #555;
            }

            html.light #searchresults .result:hover {
                background-color: #bbb;
            }

            h1 {
                font-size: 2em;
                line-height: 1em;
                font-weight: normal;
                text-shadow: 1px 1px 0px #03037d;
                padding-top: 12px;
                padding-bottom: 12px;
                margin: 0px;
                white-space: pre;
            }

            html.light h1 {
                text-shadow: -1px -1px 0px #fcfcdc;
            }

            h1 a {
                color: var(--foreground-color);
                text-decoration: none;
            }

            div.textbox {
                white-space: pre;
                padding: 5px;
            }

            #textboxes div.dual {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            @media (min-width: 800px) {
                #controls {
                    left: calc(100% - 388px);
                    width: 380px;
                }

                .hideresults #searchresults {
                    display: block;
                }

                html,
                html.hidesearch {
                    scroll-padding-top: initial;
                }
            }

            @media (min-width: 1200px) {
                #textboxes section {
                    --height-var: --wide-height;
                    --empty-height: var(--wide-height);
                }

                #textboxes span.break {
                    white-space: nowrap;
                }

                #textboxes div.dual {
                    display: grid;
                    grid-template-columns: 360px 360px;
                }

                #textboxes div.dual div.ja {
                    grid-column: 2;
                }

                #textboxes div.dual span.break {
                    white-space: pre;
                }

                #textboxes h1 br.soft {
                    display: none;
                }

                #controls {
                    left: 800px;
                    width: calc(100% - 808px);
                }
            }

            @media (min-width: 1600px) {
                #searchresults section {
                    --height-var: --wide-height;
                    --empty-height: var(--wide-height);
                }

                #searchresults span.break {
                    white-space: nowrap;
                }

                #searchresults h1 br.soft {
                    display: none;
                }

                #controls {
                    max-width: 800px;
                }
            }

            #searchresults h1,
            #searchresults div {
                padding-left: 10px;
            }

            #textboxes h1 {
                padding-left: 20px;
            }

            #textboxes div.textbox {
                padding-left: 40px;
            }

            .jumped {
                animation-duration: 1s;
                animation-name: brief-highlight;
            }

            @keyframes brief-highlight {
                from {
                    background-color: #333;
                }
            }

            html.light .jumped {
                animation-name: bright-highlight;
            }

            @keyframes bright-highlight {
                from {
                    background-color: #ddd;
                }
            }

            .textbox.hovered {
                position: relative;
            }

            .hoverbutton {
                width: 20px;
                height: 100%;
                position: absolute;
                top: 0;
                background-color: var(--background-color);
                filter: invert(1);
                -webkit-mask-position: 0 5px;
                mask-position: 0 5px;
                -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
            }

            a.linkbar {
                left: 20px;
                -webkit-mask-image: url("hyperlink.svg");
                mask-image: url("hyperlink.svg");
            }

            a.linkbar.copied {
                -webkit-mask-image: url("clipboard.svg");
                mask-image: url("clipboard.svg");
                background-color: #0b0;
                filter: none;
            }

            a.sourcebar {
                left: 0px;
                -webkit-mask-image: url("sourcefile.svg");
                mask-image: url("sourcefile.svg");
            }

            @media (max-width: 539px) {
                a.linkbar {
                    left: 0;
                }

                a.sourcebar {
                    left: unset;
                    right: 0;
                }

                #textboxes div.textbox {
                    padding-left: 20px;
                    padding-right: 20px;
                }
            }

            div.textbox,
            pre#loading,
            h1 {
                font-family: "8bitoperator Undertale Mono", Monospace;
            }

            #loading {
                padding-left: 32px;
            }

            div.ja {
                font-size: 14px;
                font-family: "JF Dot Shinonome 14 Regular", sans-serif;
            }

            /* red */
            span.R {
                color: #f00;
            }

            /* blue */
            span.B {
                color: #00f;
            }

            /* yellow */
            span.Y {
                color: #ff0;
            }

            /* green */
            span.G {
                color: #0f0;
            }

            /* ignored: W=white, X=black */

            /* unused: P=purple(#f0f), M=maroon(?) */

            /* orange */
            span.O {
                color: #ffa040;
            }

            /* "pass to the other side" */
            span.A {
                color: #00aeff;
            }

            /* Susie (S-action) */
            span.S {
                color: #ff80ff;
            }

            /* Ralsei (R-action) */
            span.V {
                color: #80ff80;
            }

            /* Ice key */
            span.I {
                color: #81c0ff;
            }

            html.light span.Y,
            html.light span.G,
            html.light span.A,
            html.light span.V,
            html.light span.S,
            html.light span.I {
                -webkit-text-stroke: 2px var(--foreground-color);
                paint-order: stroke fill;
            }

            span.picture,
            span.param {
                background: var(--foreground-color);
                color: var(--background-color);
            }

            video {
                display: block;
                width: 100%;
            }

            p {
                margin-top: 0.5em;
                margin-bottom: 0.5em;
            }

            span.underline {
                text-decoration: underline;
            }

            .sr-only {
                /* https://tailwindcss.com/docs/display#screen-reader-only */
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
                border-width: 0;
            }

            /* If these selectors aren't specific enough they become a CPU bottleneck */

            #searchresults section *::highlight(search-highlight),
            html:not(.hidesearch) #textboxes section *::highlight(text-highlight) {
                background-color: var(--highlight-color, yellow);
                color: black;
            }

            .jumped,
            .focused {
                --highlight-color: orange;
            }

            html:not(.hidesearch) img.highlit {
                filter: drop-shadow(1.5px 1.5px var(--highlight-color, yellow))
                    drop-shadow(1.5px -1.5px var(--highlight-color, yellow))
                    drop-shadow(-1.5px 1.5px var(--highlight-color, yellow))
                    drop-shadow(-1.5px -1.5px var(--highlight-color, yellow));
            }

            html:not(.hidesearch) div.highlit,
            html:not(.hidesearch) h1.highlit {
                background-color: var(--highlight-color, yellow);
                color: black;
                animation-name: none;
            }
        </style>
    </head>

    <body>
        <img id="logo" src="logo.svg" width="280" height="76" alt="deltarune text dump" />
        <div id="controls">
            <div class="row">
                <select id="language" name="language" aria-label="Language">
                    <option value="en">English</option>
                    <option value="ja">Japanese (日本語)</option>
                    <option value="both">Both</option>
                </select>
                <select id="chapter" name="chapter" aria-label="Chapter">
                    <option value="all">All chapters</option>
                    <option value="1">Chapter 1</option>
                    <option value="2">Chapter 2</option>
                    <option value="3">Chapter 3</option>
                    <option value="4">Chapter 4</option>
                </select>
                <button
                    id="light-mode-toggle"
                    title="Toggle light mode"
                    aria-label="Toggle light mode"
                ></button>
                <button
                    id="expert-toggle"
                    title="Toggle advanced settings"
                    aria-label="Toggle advanced settings"
                >
                    <img src="gear.svg" width="20" height="20" alt="" />
                </button>
                <button id="search-toggle" title="Toggle search" aria-label="Toggle search">
                    <img src="search.svg" width="20" height="20" alt="" />
                </button>
            </div>
            <search id="search">
                <div id="search1" class="row">
                    <input
                        type="search"
                        id="searchbar"
                        aria-label="Find text"
                        placeholder="Search..."
                    />
                    <div id="search-counter"></div>
                    <button
                        id="search-prev"
                        title="Previous match"
                        aria-label="Previous match"
                        disabled
                    >
                        <img src="chevron-up.svg" width="20" height="20" alt="" />
                    </button>
                    <button id="search-next" title="Next match" aria-label="Next match" disabled>
                        <img src="chevron-down.svg" width="20" height="20" alt="" />
                    </button>
                </div>
                <div
                    id="search-announce"
                    aria-live="polite"
                    aria-atomic="true"
                    class="sr-only"
                ></div>
                <div id="search2" class="row">
                    <div>
                        <input type="checkbox" id="matchcase" />
                        <label for="matchcase">Match <span class="underline">c</span>ase</label>
                    </div>
                    <div>
                        <input type="checkbox" id="wholeword" />
                        <label for="wholeword"><span class="underline">W</span>hole words</label>
                    </div>
                    <div>
                        <input type="checkbox" id="regex" />
                        <label for="regex"><span class="underline">R</span>egex</label>
                    </div>
                </div>
            </search>
            <div id="searchresults" role="listbox" tabindex="0" aria-label="Search results"></div>
        </div>
        <div id="intro">
            <p>
                <a href="DELTARUNE.txt" target="_blank">Plain text</a> (<a

            <p>
                This is a beta version. If it's buggy or you don't like it or you just want to say
                hi please use the
                <a href="https://forms.gle/cmXFH7HoadC9oMX36" target="_blank">form</a>.
            </p>
        </div>
        <script>
            // @ts-check
            "use strict";

            /**
             * @typedef {'1' | '2' | '3' | '4'} Chapter
             *
             * @typedef {{
             *      chap: "all" | Chapter;
             *      lang: "en" | "ja" | "both";
             *  }} Config
             *
             * @typedef {{
             *      count: number;
             *      ranges: Record<Config['chap'], [number, number]>;
             *      msgidOff: number;
             *      enOff: number;
             *      jaOff: number;
             *  }} Meta
             *
             * @typedef {{
             *      type: 'init';
             *      rawText: string;
             *  }} SearchInit
             * @typedef {{
             *      type: 'query';
             *      query: RegExp;
             *      config: Config;
             *      generation: number;
             *  }} SearchQuery
             * @typedef {number} Result
             * @typedef {{
             *      generation: number;
             *      results: Result[];
             *  }} ResultList
             */

            const controls = /** @type {HTMLDivElement} */ (document.getElementById("controls"));
            const lightModeToggle = /** @type {HTMLButtonElement} */ (
                document.getElementById("light-mode-toggle")
            );
            const searchBar = /** @type {HTMLInputElement} */ (
                document.getElementById("searchbar")
            );
            const searchResultsDiv = /** @type {HTMLDivElement} */ (
                document.getElementById("searchresults")
            );
            const expertToggle = /** @type {HTMLButtonElement} */ (
                document.getElementById("expert-toggle")
            );
            const searchToggle = /** @type {HTMLButtonElement} */ (
                document.getElementById("search-toggle")
            );
            const searchPrev = /** @type {HTMLButtonElement} */ (
                document.getElementById("search-prev")
            );
            const searchNext = /** @type {HTMLButtonElement} */ (
                document.getElementById("search-next")
            );
            const searchCounter = /** @type {HTMLDivElement} */ (
                document.getElementById("search-counter")
            );
            const searchAnnounce = /** @type {HTMLDivElement} */ (
                document.getElementById("search-announce")
            );
            const inputMatchCase = /** @type {HTMLInputElement} */ (
                document.getElementById("matchcase")
            );
            const inputWholeWord = /** @type {HTMLInputElement} */ (
                document.getElementById("wholeword")
            );
            const inputRegex = /** @type {HTMLInputElement} */ (document.getElementById("regex"));

            lightModeToggle.addEventListener("click", function () {
                if (document.documentElement.classList.toggle("light")) {
                    localStorage.setItem("deltaruneLightMode", "true");
                } else {
                    localStorage.removeItem("deltaruneLightMode");
                }
            });

            if (localStorage.getItem("deltaruneLightMode")) {
                document.documentElement.classList.add("light");
            }

            if (localStorage.getItem("dr-expert")) {
                document.documentElement.classList.add("expert");
                loadSearchFlags();
            }

            function loadSearchFlags() {
                const sessionFlags = sessionStorage.getItem("dr-search-flags") || "";
                inputMatchCase.checked = sessionFlags[0] === "1";
                inputWholeWord.checked = sessionFlags[1] === "1";
                inputRegex.checked = sessionFlags[2] === "1";
            }

            const selects = /** @type {const} */ ([
                { id: "chapter", key: "chap", default_: "all" },
                { id: "language", key: "lang", default_: "en" },
            ]);

            /** @type {Config} */
            // @ts-ignore
            const config = {};

            for (const select of selects) {
                const elem = /** @type {HTMLSelectElement} */ (document.getElementById(select.id));

                elem.addEventListener("change", function (event) {
                    const value = elem.selectedOptions[0].value;
                    const newURL = new URL(String(window.location));
                    if (value === select.default_) {
                        newURL.searchParams.delete(select.key);
                    } else {
                        newURL.searchParams.set(select.key, value);
                    }
                    if (newURL.searchParams.sort) {
                        newURL.searchParams.sort();
                    }
                    window.history.pushState({}, "", newURL);
                    // @ts-ignore
                    config[select.key] = value;
                    render();
                    processSearchInput();
                });
            }

            function loadConfigFromURL() {
                const params = new URL(String(window.location)).searchParams;
                let didChange = false;
                for (const select of selects) {
                    const value = params.get(select.key) || select.default_;
                    if (config[select.key] !== value) {
                        didChange = true;
                    }
                    // @ts-ignore
                    config[select.key] = value;

                    for (const option of /** @type {HTMLSelectElement} */ (
                        document.getElementById(select.id)
                    ).options) {
                        if (option.value === value) {
                            option.selected = true;
                        }
                    }
                }
                return didChange;
            }

            if (window.location.hash === "#ja") {
                // Backward compat
                const newURL = new URL(String(window.location));
                newURL.searchParams.set("lang", "ja");
                newURL.hash = "";
                window.history.pushState({}, "", newURL);
            }

            loadConfigFromURL();

            if (config.lang !== "en") {
                const link = document.createElement("link");
                link.rel = "preload";
                link.as = "font";
                link.crossOrigin = "anonymous";
                link.href = "/style/JF-Dot-Shinonome-14-Regular.woff";
                document.head.appendChild(link);
            }

            addEventListener("popstate", function () {
                const didChange = loadConfigFromURL();
                render();
                if (didChange) {
                    processSearchInput();
                }
            });

            // We want to prevent subpixel antialiasing, see the `html.crisptext` rules.
            //
            // With a mix-blend-mode:
            // - Blink on Windows 11 gives blurry text.
            // - Firefox on Windows 11 doesn't blur.
            // - Blink and Firefox on Linux don't blur.
            //
            // I'm having trouble enabling subpixel AA on Linux.
            // I tested it in the past, presumably it still works.
            //
            // In Firefox on Windows 11 this successfully prevents subpixel AA.
            //
            // macOS supposedly doesn't do subpixel AA at all any more. And I don't
            // think mobile systems do it.
            //
            // So enable our workaround on:
            if (
                // Firefox on Windows
                (navigator.userAgent.includes("Gecko/20100101") &&
                    navigator.userAgent.includes("Windows NT")) ||
                // Any browser on Linux (not including Android)
                navigator.userAgent.includes("Linux")
            ) {
                document.documentElement.classList.add("crisptext");
            }

            /** @type {null | Worker} */
            let searchWorker = null;
        </script>

        <script>
            "use strict";

            if (!window.IntersectionObserver) {
                /** @type {HTMLPreElement} */ (document.getElementById("loading")).innerHTML =
                    "<p>Your browser is too old. Sorry :(</p>\n" +
                    '<p>Maybe try the <a href="DELTARUNE.txt">plain text</a> dump?</p>\n' +
                    '<p>(Or in Japanese: <a href="DELTARUNE_ja.txt" lang="ja">日本語</a>)</p>';
                window.stop();
            }

            const rawText = (function () {
                // Synchronous XHR is deprecated but never ever getting removed.
                // It's the only way to pull in flat text data during page load
                // without parsing overhead. An async fetch breaks anchor links
                // and getting things to feel exactly as native including on
                // reload is too subtle to emulate.
                //
                // Preloading synchronous XHR is not allowed. So we should do:
                // - at most one synchronous XHR request
                // - before loading any other blocking resources

                            `${idx + 1} of ${searchResults.length}: ` +
                            munge(focusedResult.innerHTML);
                    } else {
                        searchAnnounce.innerText = `${idx + 1} of ${searchResults.length}`;
                    }
                }
            }

            function renderSearchResults() {
                searchResultsByChunk.clear();
                activeSearchSections.clear();
                searchObserver.disconnect();
                searchResultsDiv.innerHTML = "";
                searchResultsDiv.removeAttribute("aria-activedescendant");
                let pendingFocusedResult = sessionStorage.getItem("dr-search-focus");
                focusSearchResult(null);
                if (!searchResults || !searchResults.length) {
                    searchPrev.disabled = true;
                    searchNext.disabled = true;
                    refreshTextHighlights();
                    return;
                }
                searchPrev.disabled = false;
                searchNext.disabled = false;

                for (let pos = 0; pos < searchResults.length; pos += CHUNK_SIZE) {
                    const chunk = searchResults.slice(pos, pos + CHUNK_SIZE);
                    let narrowHeight = 0;
                    let wideHeight = 0;
                    /** @type {Result | null} */
                    let preloadFocus = null;
                    for (const result of chunk) {
                        const msgIdx = result >> 1;
                        const lang = result & 1 ? "ja" : "en";
                        narrowHeight += lang === "en" ? nhenFor(msgIdx) : nhjaFor(msgIdx);
                        wideHeight += lang === "en" ? whenFor(msgIdx) : whjaFor(msgIdx);

                        const textChunkIdx = (msgIdx / CHUNK_SIZE) | 0;
                        let groupResults = searchResultsByChunk.get(textChunkIdx);
                        if (!groupResults) {
                            searchResultsByChunk.set(textChunkIdx, [result]);
                        } else {
                            groupResults.push(result);
                        }

                        if (pendingFocusedResult && !preloadFocus) {
                            if (pendingFocusedResult === lang + ":" + msgIdx) {
                                preloadFocus = result;
                                pendingFocusedResult = null;
                            }
                        }
                    }
                    const section = document.createElement("section");
                    section.style.setProperty("--narrow-height", String(narrowHeight));
                    section.style.setProperty("--wide-height", String(wideHeight));
                    section.dataset.index = String(pos / CHUNK_SIZE);
                    searchResultsDiv.appendChild(section);
                    if (pos === 0) {
                        // Avoid observer flicker for cheap common case
                        fillSearchSection(section);
                    } else {
                        searchObserver.observe(section);
                    }
                    if (preloadFocus) {
                        fillSearchSection(section);
                        const box = [...section.children].find(function (box) {
                            return (
                                box instanceof HTMLElement &&
                                box.id &&
                                searchResults &&
                                searchResults[+box.id.slice(7)] === preloadFocus
                            );
                        });
                        if (box instanceof HTMLElement) {
                            focusSearchResult(box, false);
                            box.scrollIntoView({
                                behavior: "instant",
                                block: "center",
                            });
                        }
                    }
                }
                refreshTextHighlights();
            }

            const searchObserver = new IntersectionObserver(
                function (entries) {
                    for (const entry of entries) {
                        if (!(entry.target instanceof HTMLElement)) {
                            continue;
                        }
                        if (entry.isIntersecting && !entry.target.hasChildNodes()) {
                            fillSearchSection(entry.target);
                        } else if (
                            !entry.isIntersecting &&
                            entry.target.hasChildNodes() &&
                            !(focusedResult && focusedResult.parentElement === entry.target)
                        ) {
                            fixHeight(entry.boundingClientRect, entry.target);
                            entry.target.innerHTML = "";
                            activeSearchSections.delete(entry.target);
                        }
                    }
                },
                { root: searchResultsDiv }
            );

            /** @param {HTMLElement} section */
            function fillSearchSection(section) {
                if (section.hasChildNodes() || !section.dataset.index || !searchResults) {
                    return;
                }

                const startIdx = +section.dataset.index * CHUNK_SIZE;
                const endIdx = Math.min(
                    (+section.dataset.index + 1) * CHUNK_SIZE,
                    searchResults.length
                );

                let newHTML = "";
                for (let i = startIdx; i < endIdx; i++) {
                    const result = searchResults[i];
                    const msgIdx = result >> 1;
                    if (dupFor(msgIdx) & 4) {
                        newHTML +=
                            `<h1 id="search-${i}" role="option"` +
                            ` class="result">${enFor(msgIdx)}</h1>`;
                    } else if (result & 1) {
                        newHTML +=
                            `<div id="search-${i}" role="option"` +
                            ` class="textbox result ja" lang="ja">${jaFor(msgIdx)}</div>`;
                    } else {
                        newHTML +=
                            `<div id="search-${i}" role="option"` +
                            ` class="textbox result">${enFor(msgIdx)}</div>`;
                    }
                }
                section.innerHTML = newHTML;
                const ranges = [];
                for (let i = 0; i < section.childNodes.length; i++) {
                    const node = section.childNodes[i];
                    if (node instanceof HTMLElement) {
                        if (CSS.highlights) {
                            ranges.push(...highlightElem(node, searchResults[startIdx + i] >> 1));
                        }
                    }
                }
                activeSearchSections.set(section, ranges);
                if (CSS.highlights) {
                    CSS.highlights.set(
                        "search-highlight",
                        new Highlight(...[...activeSearchSections.values()].flat())
                    );
                }
            }

            /**
             * @param {string} text
             * @return {string}
             */
            function munge(text) {
                return text.replace(
                    /<[^>]*>|[ \n\u3000]{2,}|[\n\u3000]|&gt;|&lt;|&amp;|[！？＊。～：（）]/g,
                    function (match) {
                        if (match[0] === "<") {
                            const altIdx = match.indexOf('alt="');
                            if (altIdx !== -1) {
                                return match.slice(altIdx + 5).split('"')[0];
                            }
                            return "";
                        }
                        return normalizeMap.get(match) || " ";
                    }
                );
            }

            /**
             * @param {HTMLElement} elem
             * @param {number} msgIdx
             * @returns {Range[]}
             */
            function highlightElem(elem, msgIdx) {
                if (!searchQuery) {
                    return [];
                }
                const text = munge(elem.lang === "ja" ? jaFor(msgIdx) : enFor(msgIdx));
                /** @type {[number, number][]} */
                const matches = [];
                searchQuery.lastIndex = 0;
                /** @type {RegExpExecArray|null} */
                let match;
                while ((match = searchQuery.exec(text))) {
                    if (!match[0].length) {
                        searchQuery.lastIndex++;
                    } else if (
                        matches[matches.length - 1] &&
                        matches[matches.length - 1][1] === match.index
                    ) {
                        matches[matches.length - 1][1] += match[0].length;
                    } else {
                        matches.push([match.index, match.index + match[0].length]);
                    }
                }
                if (!matches.length) {
                    return [];
                }
                /** @type {Range[]} */
                const ranges = [];
                try {
                    /** @type {ChildNode[]} */
                    const stack = [elem];
                    let range = new Range();
                    let matchIdx = 0;
                    let pos = 0;
                    let foundStart = false;
                    while (stack.length && matchIdx < matches.length) {
                        const [start, end] = matches[matchIdx];
                        const cur = stack[stack.length - 1];
                        if (cur instanceof Text) {
                            let isWhitespace = false;
                            let elemPos = 0;
                            let gotoNextMatch = false;
                            const oldPos = pos;
                            for (const piece of cur.textContent.split(/(\s+)/)) {
                                let realWidth, posWidth;
                                if (isWhitespace) {
                                    realWidth = piece.length;
                                    posWidth = 1;
                                } else {
                                    realWidth = posWidth = piece.length;
                                }
                                if (!foundStart && pos + posWidth >= start) {
                                    if (isWhitespace) {
                                        range.setStart(cur, elemPos + realWidth);
                                    } else {
                                        range.setStart(cur, start - pos + elemPos);
                                    }
                                    foundStart = true;
                                }
                                if (foundStart && pos + posWidth >= end) {
                                    if (isWhitespace) {
                                        range.setEnd(cur, elemPos + realWidth);
                                    } else {
                                        range.setEnd(cur, end - pos + elemPos);
                                    }
                                    ranges.push(range);
                                    range = new Range();
                                    matchIdx++;
                                    foundStart = false;
                                    gotoNextMatch = true;
                                    break;
                                }
                                isWhitespace = !isWhitespace;
                                pos += posWidth;
                                elemPos += realWidth;
                            }
                            if (gotoNextMatch) {
                                pos = oldPos;
                                continue;
                            }
                        } else if (cur instanceof HTMLImageElement) {
                            if (!foundStart && pos + cur.alt.length >= start) {
                                range.setStart(cur, 0);
                                foundStart = true;
                            }
                            if (pos + cur.alt.length > start) {
                                cur.classList.add("highlit");
                            }
                            if (foundStart && pos + cur.alt.length >= end) {
                                range.setEnd(cur, 0);
                                ranges.push(range);
                                range = new Range();
                                matchIdx++;
                                foundStart = false;
                                continue;
                            }
                            pos += cur.alt.length;
                        }

                        if (cur.firstChild) {
                            stack.push(cur.firstChild);
                        } else {
                            while (stack.length && !stack[stack.length - 1].nextSibling) {
                                stack.pop();
                            }
                            if (stack.length <= 1) {
                                break;
                            }
                            const sib = stack[stack.length - 1].nextSibling;
                            if (!sib) {
                                break;
                            }
                            stack[stack.length - 1] = sib;
                        }
                    }
                } catch (error) {
                    console.error(error);
                }
                return ranges;
            }

            searchResultsDiv.addEventListener("click", function (event) {
                if (!(event.target instanceof Element) || event.target.closest("a")) {
                    return;
                }
                const textbox = event.target.closest(".result");
                if (textbox instanceof HTMLElement) {
                    focusSearchResult(textbox);
                    setSearchHidden(true);
                }
            });

            /**
             * @param {number} idx
             * @return {Chapter}
             */
            function chapForIdx(idx) {
                for (const chap of /** @type {const} */ (["1", "2", "3"])) {
                    if (idx < meta.ranges[chap][1]) {
                        return chap;
                    }
                }
                return "4";
            }

            /** @param {Result} result */
            function idForResult(result) {
                const idx = result >> 1;
                const chap = chapForIdx(idx);
                const msgid = msgidFor(idx);
                if (!msgid) {
                    return chap;
                } else if (dupFor(idx) & 4) {
                    return chap + "_" + msgid;
                } else {
                    const lang = result & 1 ? "ja" : "en";
                    return `${lang}:${chap}:${msgidFor(idx)}`;
                }
            }

            /** @param {HTMLElement | null} resultBox */
            function focusSearchResult(resultBox, scroll = true) {
                focusedResult = resultBox;
                if (!resultBox || !resultBox.id || !searchResults) {
                    sessionStorage.removeItem("dr-search-focus");
                    return;
                }
                const result = searchResults[+resultBox.id.slice(7)];
                const msgIdx = result >> 1;
                const lang = result & 1 ? "ja" : "en";
                sessionStorage.setItem("dr-search-focus", lang + ":" + msgIdx);
                for (const elem of document.getElementsByClassName("focused")) {
                    elem.classList.remove("focused");
                    elem.removeAttribute("aria-selected");
                }
                searchResultsDiv.setAttribute("aria-activedescendant", resultBox.id);
                resultBox.classList.add("focused");
                resultBox.setAttribute("aria-selected", "true");
                const section = document.getElementById("chunk-" + ((+msgIdx / CHUNK_SIZE) | 0));
                if (section instanceof HTMLElement) {
                    fillTextSection(section);
                }
                renderSearchCounter();
                const target = document.getElementById(idForResult(result));
                if (!target) {
                    return;
                }
                for (const oldTarget of document.getElementsByClassName("jumped")) {
                    oldTarget.classList.remove("jumped");
                    if (oldTarget === target) {
                        target.offsetHeight; // trigger reflow to restart animation
                    }
                }
                target.classList.add("jumped");
                if (scroll) {
                    target.scrollIntoView({
                        behavior: "instant",
                        block: "center",
                    });
                }
                return target;
            }

            /**
             * @param {boolean} reverse
             * @return {HTMLElement | null}
             */
            function findAdjacentResult(reverse) {
                if (!focusedResult) {
                    return null;
                }
                const sibling = reverse ? focusedResult.previousSibling : focusedResult.nextSibling;
                if (sibling instanceof HTMLElement) {
                    return sibling;
                }
                if (!focusedResult.parentElement) {
                    return null;
                }
                const sibSect = reverse
                    ? focusedResult.parentElement.previousSibling
                    : focusedResult.parentElement.nextSibling;
                if (!(sibSect instanceof HTMLElement)) {
                    return null;
                }
                fillSearchSection(sibSect);
                const child = reverse ? sibSect.lastChild : sibSect.firstChild;
                if (!(child instanceof HTMLElement)) {
                    return null;
                }
                return child;
            }

            /**
             * @param {boolean} reverse
             * @return {HTMLElement | null}
             */
            function findInitialResult(reverse) {
                const section = reverse ? searchResultsDiv.lastChild : searchResultsDiv.firstChild;
                if (!(section instanceof HTMLElement)) {
                    return null;
                }
                fillSearchSection(section);
                const result = reverse ? section.lastChild : section.firstChild;
                if (!(result instanceof HTMLElement)) {
                    return null;
                }
                return result;
            }

            /** @param {boolean} reverse */
            function findNext(reverse, collapse = true) {
                if (!searchResults || !searchResults.length) {
                    return;
                }

                focusSearchResult(findAdjacentResult(reverse) || findInitialResult(reverse));
                if (!focusedResult) {
                    return;
                }

                focusedResult.scrollIntoView({
                    behavior: "instant",
                    block: "center",
                });
                if (collapse) {
                    setSearchHidden(true);
                }
            }

            searchBar.addEventListener("keydown", function (event) {
                if (event.isComposing || event.defaultPrevented) {
                    return;
                }
                if (event.key === "Enter") {
                    event.preventDefault();
                    announceResultText = true;
                    try {
                        findNext(event.shiftKey);
                    } finally {
                        announceResultText = false;
                    }
                } else if (event.altKey && event.key === "c") {
                    event.preventDefault();
                    if (!document.documentElement.classList.contains("expert")) {
                        toggleExpert();
                    }
                    inputMatchCase.click();
                } else if (event.altKey && event.key === "w") {
                    event.preventDefault();
                    if (!document.documentElement.classList.contains("expert")) {
                        toggleExpert();
                    }
                    inputWholeWord.click();
                } else if (event.altKey && event.key === "r") {
                    event.preventDefault();
                    if (!document.documentElement.classList.contains("expert")) {
                        toggleExpert();
                    }
                    inputRegex.click();
                }
            });

            document.addEventListener("keydown", function (event) {
                if (event.isComposing || event.defaultPrevented) {
                    return;
                }
                const control = event.ctrlKey || event.metaKey;
                if (!control && event.key === "Escape") {
                    // In Firefox Ctrl+Esc toggles highlight
                    // In Chromium it ends the search and selects the current match
                    event.preventDefault();
                    searchBar.blur();
                    setSearchHidden("very");
                } else if (!event.altKey && control && (event.key === "g" || event.key === "G")) {
                    event.preventDefault();
                    searchBar.focus();
                    searchBar.select();
                    announceResultText = true;
                    try {
                        findNext(event.shiftKey);
                    } finally {
                        announceResultText = false;
                    }
                } else if (!event.altKey && control && event.key === "f") {
                    event.preventDefault();
                    setSearchHidden(false);
                    const selection = window.getSelection();
                    if (selection && selection.toString()) {
                        if (inputRegex.checked) {
                            let query = "";
                            for (const char of selection.toString()) {
                                if (".*+?^${}()|[]\\".includes(char)) {
                                    query += "\\";
                                }
                                query += char;
                            }
                            searchBar.value = query;
                        } else {
                            searchBar.value = selection.toString();
                        }
                        processSearchInput();
                    }
                    searchBar.focus();
                    searchBar.select();
                } else if (
                    !control &&
                    !event.altKey &&
                    event.key === "/" &&
                    !(event.target instanceof HTMLInputElement) &&
                    !(event.target instanceof HTMLSelectElement)
                ) {
                    // Shortcut in Firefox, not in Chromium
                    event.preventDefault();
                    setSearchHidden(false);
                    searchBar.focus();
                    searchBar.select();
                }
            });

            searchResultsDiv.addEventListener("keydown", function (event) {
                if (event.isComposing || event.defaultPrevented) {
                    return;
                }
                if (
                    event.ctrlKey ||
                    event.metaKey ||
                    event.altKey ||
                    event.shiftKey ||
                    !(event.target instanceof HTMLElement)
                ) {
                    return;
                }
                if (event.key === "Enter") {
                    const focusedResult = document.querySelector(".focused");
                    if (!(focusedResult instanceof HTMLElement)) {
                        return;
                    }
                    event.preventDefault();
                    const textbox = focusSearchResult(focusedResult);
                    if (textbox) {
                        textbox.tabIndex = -1;
                        textbox.focus({ preventScroll: true });
                        setSearchHidden(true);
                    }
                } else if (event.key === "ArrowDown" || event.key === "ArrowRight") {
                    event.preventDefault();
                    findNext(false, false);
                } else if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
                    event.preventDefault();
                    findNext(true, false);
                }
            });

            searchPrev.addEventListener("click", function () {
                findNext(true);
            });
            searchNext.addEventListener("click", function () {
                findNext(false);
            });

            searchBar.addEventListener("focus", function () {
                setSearchHidden(false);
            });
            searchBar.addEventListener("click", function () {
                setSearchHidden(false);
            });
            searchCounter.addEventListener("click", function () {
                if (document.documentElement.classList.contains("hideresults")) {
                    setSearchHidden(false);
                } else {
                    setSearchHidden(true);
                }
            });

            expertToggle.addEventListener("click", toggleExpert);

            searchToggle.addEventListener("click", function () {
                if (document.documentElement.classList.contains("hidesearch")) {
                    setSearchHidden(false);
                } else {
                    setSearchHidden("very");
                }
            });

            textboxes.addEventListener("click", function () {
                setSearchHidden(true);
            });

            function toggleExpert() {
                const expert = document.documentElement.classList.toggle("expert");
                if (!expert) {
                    if (inputMatchCase.checked || inputWholeWord.checked || inputRegex.checked) {
                        inputMatchCase.checked = false;
                        inputWholeWord.checked = false;
                        inputRegex.checked = false;
                        processSearchInput();
                    }
                    localStorage.removeItem("dr-expert");
                } else {
                    localStorage.setItem("dr-expert", "1");
                    loadSearchFlags();
                    if (inputMatchCase.checked || inputWholeWord.checked || inputRegex.checked) {
                        processSearchInput();
                    }
                }
            }

            function setupCloseWatcher() {
                // @ts-expect-error
                if (!window.CloseWatcher) {
                    return;
                }
                if (
                    !document.documentElement.classList.contains("hideresults") &&
                    searchResults &&
                    searchResults.length
                ) {
                    if (!closeWatcher) {
                        // @ts-expect-error
                        closeWatcher = new CloseWatcher();
                        // @ts-expect-error
                        closeWatcher.onclose = function () {
                            setSearchHidden(true);
                        };
                    }
                } else {
                    if (closeWatcher) {
                        closeWatcher.destroy();
                        closeWatcher = null;
                    }
                }
            }

            /** @param {boolean | 'very'} value */
            function setSearchHidden(value) {
                if (value === "very") {
                    // https://www.pixiv.net/en/artworks/57651690#3
                    document.documentElement.classList.add("hideresults", "hidesearch");
                    sessionStorage.setItem("dr-search-hidden", "2");
                } else if (value) {
                    document.documentElement.classList.add("hideresults");
                    // don't need to remove hidesearch, if it's active we can
                    // only get here by clicking #textboxes
                    sessionStorage.setItem("dr-search-hidden", "1");
                } else {
                    document.documentElement.classList.remove("hideresults", "hidesearch");
                    sessionStorage.removeItem("dr-search-hidden");
                }
                setupCloseWatcher();
            }

            if (sessionStorage.getItem("dr-search-hidden") === "2") {
                setSearchHidden("very");
            } else if (sessionStorage.getItem("dr-search-hidden")) {
                setSearchHidden(true);
            } else {
                setSearchHidden(false);
            }

            /** @param {NavigateEvent} event */
            function handleNavigate(event) {
                if (event.destination.url.split("#")[0] !== window.location.href.split("#")[0]) {
                    return;
                }
                const id = new URL(event.destination.url).hash.slice(1);
                if (!id || document.getElementById(id)) {
                    return;
                }

                const [hashChap, hashMsgid] = id2meta(id);
                if (!hashChap) {
                    return;
                }

                iterText(config, ...meta.ranges[hashChap], function (idx) {
                    if (msgidFor(idx) === hashMsgid) {
                        const chunkNo = (idx / CHUNK_SIZE) | 0;
                        const chunk = document.getElementById(`chunk-${chunkNo}`);
                        if (chunk) {
                            fillTextSection(chunk);
                        }
                        return true;
                    }
                });
            }
            try {
                navigation.addEventListener("navigate", handleNavigate);
            } catch (error) {}

            render();

            // For debugging.

            function revealAll() {
                for (const section of document.querySelectorAll("#textboxes section")) {
                    if (section instanceof HTMLElement) {
                        fillTextSection(section);
                    }
                }
                for (const section of document.querySelectorAll("#searchresults section")) {
                    if (section instanceof HTMLElement) {
                        fillSearchSection(section);
                    }
                }
            }

            function badHeights() {
                revealAll();
                return [...document.getElementsByTagName("section")].filter(function (section) {
                    const calc = +getComputedStyle(section).getPropertyValue("--empty-height");
                    return section.offsetHeight !== calc;
                });
            }

            function badWidths() {
                revealAll();
                return [...document.querySelectorAll(".textbox")].filter(function (x) {
                    return x.scrollWidth > x.clientWidth;
                });
            }
        </script>
    </body>
</html>
